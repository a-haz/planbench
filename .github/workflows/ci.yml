name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3-matplotlib

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark
        run: ./build/planbench_benchmark --small --output /tmp/benchmark_small.csv --paths /tmp/example_paths_small.csv

      - name: Plot
        run: |
          python3 scripts/plot_benchmark.py --csv /tmp/benchmark_small.csv --paths /tmp/example_paths_small.csv --out-dir /tmp/plots
          test -s /tmp/plots/example_paths.png
          test -s /tmp/plots/length_runtime.png
          test -s /tmp/plots/rrt_length_vs_iterations.png
